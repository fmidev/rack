# This is the base file for generating doxyfiles.

# Code (and its .dox pages) lives under src/, scanned recursively via INPUT below. Previously no
# INPUT was set at all, so doxygen fell back to scanning everything under the current directory -
# that's what let it wander into Debug/, Release/, doc/, docs/, python/, rack-devutils/, tests/,
# bak/, etc. Those are now out of scope entirely (not listed in INPUT, so never walked).
INPUT            = ./src
HTML_OUTPUT = html
IMAGE_PATH       = ./images ./tests/out ./demo
# NOTE: dropped the "." entry that used to be here. It made doxygen deep-walk the whole repo root
# (Debug/, Release/, rack-devutils/, python/, etc. again) looking for \include/\example targets,
# even with EXAMPLE_RECURSIVE=NO - that setting does not appear to suppress the directory walk
# itself in this doxygen version (1.9.8), only some other aspect of example lookup. Checked that
# none of this project's ~80 \include targets rely on "."; they resolve under ./demo or are
# already dangling regardless (pre-existing, unrelated to this change).
# ./demo itself is NOT similarly prunable: its \include targets are scattered directly in demo/,
# demo/out/ and demo/examples/, so removing demo/ (or narrowing to one subdirectory) would break
# real references. demo/ is a big data tree (most of it unrelated datasets), so it still dominates
# doxygen's traversal time (~2700 of the remaining ~3000 directories walked) - see chat for options.
#EXAMPLE_PATH     = ./demo ./doxygen
# Remove /demo later?
EXAMPLE_PATH     = ./tests/out ./demo ./doxygen
RECURSIVE        = YES
USE_PDFLATEX     = YES
USE_MATHJAX      = YES
MATHJAX_FORMAT   = HTML-CSS
HAVE_DOT         = YES
HIDE_SCOPE_NAMES = YES

# enabling HAVE_DOT along with INTERACTIVE_SVG while setting DOT_IMAGE_FORMAT to svg, will make doxygen produce SVG images that will allow the user to zoom and pan (this only happens when the size of the images exceeds a certain size).

#INTERACTIVE_SVG = YES
#DOT_IMAGE_FORMAT = svg

# Build output under src/ itself (object/dependency files - no source files ever match there).
EXCLUDE = ./src/Build ./bak ./src/drain/util/bak

# Silence the "non supported language" warnings from custom \~exec / \~remark / \~conf etc. blocks.
# These are Rack-specific documentation extensions used by the .dox pages and demo scripts.
# Mapping them to empty aliases suppresses the warning without affecting HTML output.
ALIASES += "exec{1}= " \
           "remark{1}= " \
           "conf{1}= " \
           "cliconf{1}= " \
           "pyconf{1}= " \
           "stop{1}= " \
           "linkfile{1}=\htmlonly <a href=\"\1.txt\" target=\"\1\" rel=\"noopener\">\1</a> \endhtmlonly"

PROJECT_LOGO=demo/rack-logo-110x55.png
HTML_HEADER = rack-header.html
HTML_FOOTER = rack-footer.html
HTML_EXTRA_STYLESHEET  = rack.css

# \linkfile{<name>} (above) renders a plain <a href="<name>.txt"> instead of embedding a
# command inline - handy for long example command lines (see doxymoron.py's CliConf.linkFile
# and the "linkfile" key in scan_dox()). The .txt suffix is what makes browsers display the
# file instead of offering it for download; the <name>.txt file is the only copy doxymoron
# writes, there's no separate extension-true original. For the link to resolve, each file
# must physically exist in the HTML output; Doxygen does not expand directories or globs for
# HTML_EXTRA_FILES, so list every linked file (with its .txt suffix) individually.
HTML_EXTRA_FILES = ./tests/out/composite-fi_rack.sh.txt

# If you want to add or override settings, put them above.
# Primarily, consider hacking your Makefile instead.
