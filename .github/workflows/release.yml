name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

env:
  IMAGE: quay.io/fmi/rack

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that tag matches RACK_VERSION
        run: |
          SRC_VERSION=$(fgrep RACK_VERSION src/main/rack.h | tr '(,)' '|.|' | tr -d \'\" | cut -d'|' -f2)
          echo "Tag: ${GITHUB_REF_NAME}  Source: v${SRC_VERSION}"
          test "${GITHUB_REF_NAME}" = "v${SRC_VERSION}"

      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: src
          file: src/Dockerfile.ubuntu22
          load: true
          tags: rack:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: |
          docker run --rm rack:test rack --version
          docker run --rm rack:test rack --help > /dev/null
          docker run --rm rack:test rack --help cCreate > /dev/null

      - name: Log in to Quay
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: src
          file: src/Dockerfile.ubuntu22
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  release:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Rack $GITHUB_REF_NAME" \
            --generate-notes
