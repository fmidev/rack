name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make \
            libhdf5-dev libproj-dev libpng-dev libtiff-dev libgeotiff-dev python3

      - name: Build
        run: make -j"$(nproc)"

      - name: Smoke test
        run: |
          src/rack --version
          src/rack --help > /dev/null

      - name: Python tests
        continue-on-error: true
        run: |
          export PATH="$PWD/src:$PATH"
          make test-python

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: src
          file: src/Dockerfile.ubuntu22
          load: true
          tags: rack:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: docker run --rm rack:ci rack --version
